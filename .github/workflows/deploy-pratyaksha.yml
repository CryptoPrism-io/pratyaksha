name: Deploy Pratyaksha Frontend (S3 + CloudFront)

# Frontend (React/Vite) -> private S3 bucket behind CloudFront (OAC)
# (canonical https://dghabvfczocs9.cloudfront.net) in AWS account 405633560616.
# Infra is the CloudFormation stack `pratyaksha-frontend` (us-east-1).
#
# Auth: GitHub OIDC (KEYLESS) -> IAM role gha-pratyaksha-frontend-deploy, scoped
# to this repo's main branch and to this bucket + distribution only.
#
# Firebase is still used for Auth + Cloud Messaging (VITE_FIREBASE_* config),
# only hosting moved off Firebase. The old ai-becoming.web.app site is no
# longer updated by this workflow.
#
# Backend (Lightsail) deploys separately via deploy-backend.yml.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Pratyaksha/dashboard/**'
      - '.github/workflows/deploy-pratyaksha.yml'

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::405633560616:role/gha-pratyaksha-frontend-deploy
  S3_BUCKET: pratyaksha-frontend-prod-405633560616
  CLOUDFRONT_DISTRIBUTION_ID: E1R3GEECO4ZCMK
  # Backend origin baked into the bundle (public Lightsail URL — hardcoded, not a secret).
  VITE_API_BASE_URL: https://pratyaksha.8xy5d1tats0s8.us-east-1.cs.amazonlightsail.com

concurrency:
  group: deploy-pratyaksha-frontend
  cancel-in-progress: false

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required for AWS OIDC
    defaults:
      run:
        working-directory: Pratyaksha/dashboard
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, keyless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and build frontend
        env:
          VITE_AIRTABLE_API_KEY: ${{ secrets.VITE_AIRTABLE_API_KEY }}
          VITE_AIRTABLE_BASE_ID: ${{ secrets.VITE_AIRTABLE_BASE_ID }}
          VITE_AIRTABLE_TABLE_ID: ${{ secrets.VITE_AIRTABLE_TABLE_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: |
          npm ci
          npm run build

      # Cache headers mirror the old firebase.ai-becoming.json:
      # hashed assets immutable, entry points / service workers never cached.
      - name: Upload to S3
        run: |
          aws s3 sync dist/assets "s3://$S3_BUCKET/assets" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist/ "s3://$S3_BUCKET/" --delete \
            --exclude "assets/*" \
            --exclude index.html --exclude sw.js \
            --exclude firebase-messaging-sw.js --exclude manifest.json \
            --cache-control "public, max-age=86400"
          for f in index.html sw.js firebase-messaging-sw.js manifest.json; do
            if [ -f "dist/$f" ]; then
              aws s3 cp "dist/$f" "s3://$S3_BUCKET/$f" \
                --cache-control "no-cache, no-store, must-revalidate"
            fi
          done

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/index.html" "/sw.js" "/firebase-messaging-sw.js" "/manifest.json" "/"

      - name: Display URL
        run: echo "Frontend deployed -> https://dghabvfczocs9.cloudfront.net"
